<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1220" viewBox="0 0 1800 1220" role="img" aria-labelledby="title desc">
<title id="title">Agent Runtime Governance: A Reference Architecture</title>
<desc id="desc">Governance services establish policy, identity, credential custody and evidence retention. Inside a governed execution domain, a runtime control system outside the agent runtime governs separate agent and tool sandboxes. An adjacent credential broker mediates external access. Arrows distinguish control, operation and evidence flows.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#334155"/></marker>
<marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#087f72"/></marker>
</defs>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#172b43}.small{font-size:18px;fill:#475569}.label{font-size:17px;font-weight:700;letter-spacing:1.5px}.heading{font-size:24px;font-weight:700}.body{font-size:20px}.flow{fill:none;stroke:#334155;stroke-width:2;marker-end:url(#arrow)}.control{stroke-dasharray:7 6}.evidence{fill:none;stroke:#087f72;stroke-width:2.5;marker-end:url(#green)}</style>
<rect width="1800" height="1220" fill="#fff"/>

<text x="48" y="52" class="label">REFERENCE ARCHITECTURE / REVIEW DRAFT 0.3</text>
<text x="48" y="108" font-size="44" font-weight="700">Agent Runtime Governance</text>
<text x="48" y="144" class="body">Least privilege • explicit policy • controlled authority changes • verifiable evidence</text>
<text x="48" y="192" class="label">GOVERNANCE SERVICES</text>
<rect x="48" y="210" width="406" height="120" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="70" y="247" class="heading">Policy and identity</text>
<text x="70" y="282" class="body">Trust, enrollment, session binding</text>
<text x="70" y="309" class="body">Approvals, leases and revocation</text>
<rect x="478" y="210" width="406" height="120" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="500" y="247" class="heading">Credential custody</text>
<text x="500" y="282" class="body">Vault or provider token service</text>
<text x="500" y="309" class="body">Scoped provisioning to local brokers</text>
<rect x="908" y="210" width="406" height="120" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="930" y="247" class="heading">Artifact admission</text>
<text x="930" y="282" class="body">Tool and model provenance</text>
<text x="930" y="309" class="body">Verified claims and policy decisions</text>
<rect x="1338" y="210" width="414" height="120" rx="10" fill="#edf8f5" stroke="#8abdb4" stroke-width="2"/>
<text x="1360" y="247" class="heading">Evidence retention</text>
<text x="1360" y="282" class="body">Independent verification</text>
<text x="1360" y="309" class="body">Durable records and signed receipts</text>
<rect x="48" y="392" width="1266" height="640" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
<text x="72" y="430" class="label">GOVERNED EXECUTION DOMAIN / OUTER ISOLATION BOUNDARY</text>
<text x="72" y="460" class="small">Separate capability contexts for agents, tools, and generated-code execution</text>
<rect x="72" y="486" width="1218" height="240" rx="10" fill="#edf4fb" stroke="#53799e" stroke-width="2"/>
<text x="96" y="520" class="label">RUNTIME CONTROL SYSTEM / OUTSIDE THE AGENT RUNTIME</text>
<rect x="96" y="542" width="370" height="152" rx="10" fill="#fff" stroke="#91aec9" stroke-width="2"/>
<text x="118" y="579" class="heading">Policy enforcement</text>
<text x="118" y="614" class="body">Session and invocation binding</text>
<text x="118" y="641" class="body">Filesystem and socket controls</text>
<text x="118" y="668" class="body">Grant changes and lease checks</text>
<rect x="490" y="542" width="370" height="152" rx="10" fill="#fff" stroke="#91aec9" stroke-width="2"/>
<text x="512" y="579" class="heading">Credential broker</text>
<text x="512" y="614" class="body">Tool-scoped credential use</text>
<text x="512" y="641" class="body">Destination, method and path</text>
<text x="512" y="668" class="body">Information-flow release checks</text>
<rect x="884" y="542" width="382" height="152" rx="10" fill="#edf8f5" stroke="#8abdb4" stroke-width="2"/>
<text x="906" y="579" class="heading">Protected evidence writer</text>
<text x="906" y="614" class="body">Intent, decisions and outcomes</text>
<text x="906" y="641" class="body">Keys inaccessible to agents</text>
<text x="906" y="668" class="body">Capture failure blocks activity</text>
<rect x="72" y="824" width="280" height="138" rx="10" fill="#fff9ef" stroke="#c9aa78" stroke-width="2"/>
<text x="94" y="861" class="heading">Agent A sandbox</text>
<text x="94" y="896" class="body">Untrusted agent process</text>
<text x="94" y="923" class="body">Explicit capabilities</text>
<rect x="376" y="824" width="280" height="138" rx="10" fill="#fff9ef" stroke="#c9aa78" stroke-width="2"/>
<text x="398" y="861" class="heading">Tool invocation A</text>
<text x="398" y="896" class="body">Separate sandbox</text>
<text x="398" y="923" class="body">Narrow credential context</text>
<rect x="680" y="824" width="280" height="138" rx="10" fill="#fff9ef" stroke="#c9aa78" stroke-width="2"/>
<text x="702" y="861" class="heading">Agent B sandbox</text>
<text x="702" y="896" class="body">Independent policy</text>
<text x="702" y="923" class="body">No inherited expansion</text>
<rect x="984" y="824" width="282" height="138" rx="10" fill="#fff9ef" stroke="#c9aa78" stroke-width="2"/>
<text x="1006" y="861" class="heading">Generated code</text>
<text x="1006" y="896" class="body">Isolated inputs and scratch</text>
<text x="1006" y="923" class="body">No ambient authority</text>
<text x="1006" y="950" class="body">Bounded execution</text>
<text x="72" y="1003" class="small">Generated outputs remain untrusted; validate and retain data restrictions before import or release.</text>
<rect x="1360" y="486" width="392" height="172" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1382" y="523" class="heading">Governed destinations</text>
<text x="1382" y="558" class="body">External APIs and remote tools</text>
<text x="1382" y="585" class="body">Approved model inference</text>
<text x="1382" y="612" class="body">No direct bypass path</text>
<rect x="1360" y="742" width="392" height="178" rx="10" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1382" y="779" class="heading">Information-flow contract</text>
<text x="1382" y="814" class="body">Conservative label propagation</text>
<text x="1382" y="841" class="body">Approval binds exact content,</text>
<text x="1382" y="868" class="body">destination and operation</text>
<path d="M250 330 V392" class="flow control"/>
<text x="267" y="371" class="small">grants / refresh</text>
<path d="M675 330 V392" class="flow control"/>
<text x="691" y="371" class="small">scoped credentials</text>
<path d="M1110 330 V392" class="flow control"/>
<text x="1126" y="371" class="small">admission</text>
<path d="M1266 676 H1328 V354 H1540 V330" class="evidence"/>
<text x="1376" y="384" class="small">signed evidence</text>
<path d="M860 590 H884" class="evidence"/>
<path d="M466 710 H1075 V694" class="evidence"/>
<path d="M466 676 V710" class="evidence"/>
<path d="M860 562 H878 V474 H1344 V568 H1360" class="flow"/>
<text x="1376" y="463" class="small">authorized requests</text>
<path d="M212 824 V772 H260 V694" class="flow"/>
<text x="83" y="754" class="small">operation request</text>
<path d="M820 824 V752 H320 V694" class="flow"/>
<path d="M410 694 V800 H516 V824" class="flow"/>
<text x="377" y="780" class="small">brokered launch</text>
<path d="M516 824 V814 H675 V694" class="flow"/>
<path d="M1125 824 V792 H720 V694" class="flow"/>
<text x="935" y="780" class="small">mediated resource access</text>
<path d="M48 1090 H108" class="flow"/>
<text x="124" y="1096" class="small">Operation</text>
<path d="M300 1090 H360" class="flow control"/>
<text x="376" y="1096" class="small">Control / provisioning</text>
<path d="M650 1090 H710" class="evidence"/>
<text x="726" y="1096" class="small">Evidence</text>
<text x="48" y="1142" class="small">Runtime functions may share an implementation; credentials and authority remain isolated by session and invocation.</text>
<text x="48" y="1176" class="small">Select isolation mechanisms against required separation, permitted crossings, and shared trust dependencies.</text>
</svg>
